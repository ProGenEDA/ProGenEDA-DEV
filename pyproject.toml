[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proteusgen"
version = "0.1.0"
description = "Deterministic, fixture-backed Proteus project generator research tool"
requires-python = ">=3.11"
dependencies = ["pypdf>=5.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
build-exe = ["pyinstaller>=6.0"]

[project.scripts]
proteusgen = "proteusgen.cli:main"
progen-proteus = "proteusgen.proteus_cli:main"
progen-easyeda = "Easyeda.executable:main"
progen-altium = "Altium.executable:main"

[tool.setuptools.packages.find]
where = ["proteus/active/src", "."]
include = ["proteusgen*", "kicad*", "ltspice*", "Easyeda*", "Altium*"]

[tool.setuptools.package-data]
kicad = ["source_pack/downloaded_zip/*.zip", "rules/*.json", "examples/json/*.json", "targets/*.md", "pipeline/catelogues/*.json"]
ltspice = ["pipeline/*.json", "catalogues/*.json"]
Altium = ["examples/*.json", "source_pack/donors/*.SchDoc"]
