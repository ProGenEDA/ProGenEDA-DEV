[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "progen-routing-core"
version = "0.1.0"
requires-python = ">=3.11"
description = "EDA-neutral Rust geometry and routing core for ProGenEDA KiCad routing v2"

[tool.maturin]
features = ["pyo3/extension-module"]
