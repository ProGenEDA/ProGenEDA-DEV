<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-labelledby="title description">
  <title id="title">Animated Codex 5.6 LTspice native generation flow</title>
  <desc id="description">A high-contrast blue pulse moves through grouped real executor stages: canonicalization, donor catalogue resolution, placement and beautification, routing and ASC writing, and validation plus packaging.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#05121f"/><stop offset="1" stop-color="#0a2a49"/></linearGradient>
    <linearGradient id="rail" x1="0" x2="1"><stop stop-color="#178fff"/><stop offset=".5" stop-color="#e3f6ff"/><stop offset="1" stop-color="#178fff"/></linearGradient>
    <filter id="glow" x="-180%" y="-180%" width="460%" height="460%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .card { fill:#0c2a47; stroke:#63c6ff; stroke-width:2.4; }
      .static-focus { fill:none; stroke:#79ccff; stroke-width:2; opacity:.54; }
      .step { fill:#76d1ff; font-family:Inter,Arial,sans-serif; font-size:14px; font-weight:800; letter-spacing:2px; text-anchor:middle; }
      .name { fill:#fff; font-family:Inter,Arial,sans-serif; font-size:23px; font-weight:800; text-anchor:middle; }
      .detail { fill:#d2efff; font-family:Inter,Arial,sans-serif; font-size:16px; text-anchor:middle; }
      .micro { fill:#9bdcff; font-family:Inter,Arial,sans-serif; font-size:15px; font-weight:700; text-anchor:middle; }
      .focus { fill:none; stroke:#fff; stroke-width:4; opacity:0; }
      @media (prefers-reduced-motion: reduce) { .animated { display:none; } .static-focus { stroke:#fff; opacity:1; } }
    </style>
  </defs>
  <rect width="1400" height="460" rx="26" fill="url(#bg)"/>
  <text x="700" y="56" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" text-anchor="middle">CODEX 5.6 • DONOR-NATIVE LTSPICE DELIVERY</text>
  <text x="700" y="88" fill="#b8e6ff" font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="middle">Blue motion maps to grouped real executor stages; every label remains readable without motion.</text>
  <path d="M135 247H1265" fill="none" stroke="#153e61" stroke-width="12" stroke-linecap="round"/>
  <path d="M135 247H1265" fill="none" stroke="url(#rail)" stroke-width="3" stroke-linecap="round"/>
  <g>
    <rect class="card" x="45" y="160" width="185" height="176" rx="18"/><rect class="static-focus" x="52" y="167" width="171" height="162" rx="13"/><rect class="focus animated" x="52" y="167" width="171" height="162" rx="13"><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;.16;.21;.78;.84;1" dur="8s" repeatCount="indefinite"/></rect>
    <text class="step" x="137" y="194">01 • INPUT</text><text class="name" x="137" y="230">CANONICALIZE</text><text class="detail" x="137" y="260">shared JSON</text><text class="detail" x="137" y="285">safe structure</text><text class="micro" x="137" y="315">real stage</text>
    <rect class="card" x="305" y="160" width="185" height="176" rx="18"/><rect class="static-focus" x="312" y="167" width="171" height="162" rx="13"/><rect class="focus animated" x="312" y="167" width="171" height="162" rx="13"><animate attributeName="opacity" values="0;1;1;0;0;0" keyTimes="0;.16;.37;.42;.84;1" dur="8s" repeatCount="indefinite"/></rect>
    <text class="step" x="397" y="194">02 • CATALOGUE</text><text class="name" x="397" y="230">RESOLVE</text><text class="detail" x="397" y="260">donor facts</text><text class="detail" x="397" y="285">native bounds</text><text class="micro" x="397" y="315">real stage</text>
    <rect class="card" x="565" y="160" width="205" height="176" rx="18"/><rect class="static-focus" x="572" y="167" width="191" height="162" rx="13"/><rect class="focus animated" x="572" y="167" width="191" height="162" rx="13"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.37;.42;.58;.63;1" dur="8s" repeatCount="indefinite"/></rect>
    <text class="step" x="667" y="194">03 • LAYOUT</text><text class="name" x="667" y="230">PLACE + BEAUTIFY</text><text class="detail" x="667" y="260">stock symbols</text><text class="detail" x="667" y="285">clear spacing</text><text class="micro" x="667" y="315">two real stages</text>
    <rect class="card" x="845" y="160" width="185" height="176" rx="18"/><rect class="static-focus" x="852" y="167" width="171" height="162" rx="13"/><rect class="focus animated" x="852" y="167" width="171" height="162" rx="13"><animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;.58;.63;.68;.79;1" dur="8s" repeatCount="indefinite"/></rect>
    <text class="step" x="937" y="194">04 • NATIVE ASC</text><text class="name" x="937" y="230">ROUTE + WRITE</text><text class="detail" x="937" y="260">physical WIRE</text><text class="detail" x="937" y="285">native records</text><text class="micro" x="937" y="315">two real stages</text>
    <rect class="card" x="1105" y="160" width="250" height="176" rx="18"/><rect class="static-focus" x="1112" y="167" width="236" height="162" rx="13"/><rect class="focus animated" x="1112" y="167" width="236" height="162" rx="13"><animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;.68;.79;.84;.89;1" dur="8s" repeatCount="indefinite"/></rect>
    <text class="step" x="1230" y="194">05 • RELEASE</text><text class="name" x="1230" y="230">VALIDATE + PACKAGE</text><text class="detail" x="1230" y="260">ASC + topology</text><text class="detail" x="1230" y="285">then .ASC</text><text class="micro" x="1230" y="315">two real stages</text>
  </g>
  <g class="animated" fill="#89d5ff" stroke="#fff" stroke-width="2" filter="url(#glow)">
    <circle cx="137" cy="247" r="12"><animateMotion dur="8s" repeatCount="indefinite" path="M137 247 H1230"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.04;.93;1" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="137" cy="247" r="5" opacity=".9"><animateMotion dur="8s" begin=".3s" repeatCount="indefinite" path="M137 247 H1230"/></circle>
  </g>
  <text x="700" y="400" fill="#75d0ff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="1">MAINTAINER BRIEF → CODEX 5.6 IMPLEMENTATION → EVIDENCE-BOUND ARTIFACT</text>
</svg>
