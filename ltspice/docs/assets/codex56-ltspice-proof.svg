<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">LTspice delivery evidence dashboard</title>
  <desc id="description">A visual dashboard showing 7 donor-native families, a 43-component bound, a 100 of 100 common-circuit replay, 106 tests, and native ASC output.</desc>
  <defs>
    <linearGradient id="dashBg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#0b2945"/></linearGradient>
    <filter id="metricGlow" x="-50%" y="-70%" width="200%" height="240%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .metric { fill:#0c2843; stroke:#4bb7ff; stroke-width:2; }
      .number { fill:#fff; font-family:Inter,Arial,sans-serif; font-size:52px; font-weight:800; text-anchor:middle; }
      .caption { fill:#8ed5ff; font-family:Inter,Arial,sans-serif; font-size:16px; font-weight:800; text-anchor:middle; letter-spacing:1px; }
      .note { fill:#d8efff; font-family:Inter,Arial,sans-serif; font-size:15px; text-anchor:middle; }
    </style>
  </defs>
  <rect width="1200" height="430" rx="24" fill="url(#dashBg)"/>
  <text x="600" y="54" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" text-anchor="middle">WHAT THE CODEX 5.6-ACCELERATED LTSPICE PATH DELIVERS</text>
  <text x="600" y="82" fill="#9bd9ff" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">A bounded, donor-native system with transparent evidence—not a claim of universal LTspice support.</text>
  <g transform="translate(60 125)">
    <rect class="metric" width="230" height="180" rx="18"/><text class="number" x="115" y="70" filter="url(#metricGlow)">7</text><text class="caption" x="115" y="101">DONOR-OBSERVED</text><text class="caption" x="115" y="122">NATIVE FAMILIES</text><text class="note" x="115" y="150">GND • R • C • L</text><text class="note" x="115" y="171">V • I • signal</text>
  </g>
  <g transform="translate(335 125)">
    <rect class="metric" width="230" height="180" rx="18"/><text class="number" x="115" y="76" filter="url(#metricGlow)">43</text><text class="caption" x="115" y="108">COMPONENT CAP</text><text class="note" x="115" y="145">physical-wire topology</text>
  </g>
  <g transform="translate(635 125)">
    <rect class="metric" width="230" height="180" rx="18"/><text class="number" x="115" y="76" filter="url(#metricGlow)">100/100</text><text class="caption" x="115" y="108">WEBSITE REPLAY</text><text class="note" x="115" y="145">named canonical circuits</text>
  </g>
  <g transform="translate(910 125)">
    <rect class="metric" width="230" height="180" rx="18"/><text class="number" x="115" y="76" filter="url(#metricGlow)">106</text><text class="caption" x="115" y="108">BACKEND TESTS</text><text class="note" x="115" y="145">1 optional oracle skip</text>
  </g>
  <path d="M175 350H1025" stroke="#4bb7ff" stroke-opacity=".55" stroke-width="2"/>
  <g fill="#72caff" filter="url(#metricGlow)"><circle cx="175" cy="350" r="7"/><circle cx="458" cy="350" r="7"/><circle cx="750" cy="350" r="7"/><circle cx="1025" cy="350" r="7"/></g>
  <text x="600" y="374" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">DONOR EVIDENCE → CANONICAL JSON → STOCK SYMBOLS + WIRE → VALIDATED .ASC</text>
  <text x="600" y="405" fill="#8ed5ff" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">EVIDENCE SNAPSHOT: 2026-07-16 • SEE LINKED RECORDS FOR CURRENT STATUS</text>
</svg>
