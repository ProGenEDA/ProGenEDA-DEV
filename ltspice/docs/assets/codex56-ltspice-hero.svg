    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#58b8ff" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#background)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <path d="M70 308H194V238H286V308H398V202H495" fill="none" stroke="url(#beam)" stroke-width="6" filter="url(#glow)"/>
  <path d="M710 120H804V180H902V120H1127" fill="none" stroke="url(#beam)" stroke-width="6" filter="url(#glow)"/>
  <path d="M653 214H756V300H860V224H1129" fill="none" stroke="url(#beam)" stroke-width="6" filter="url(#glow)"/>
  <g fill="#0a1726" stroke="#57b9ff" stroke-width="2">
    <rect x="174" y="216" width="42" height="44" rx="4"/>
    <rect x="266" y="216" width="42" height="44" rx="4"/>
    <path d="M371 201l10-16 10 32 10-32 10 32 10-16" fill="none"/>
    <circle cx="538" cy="202" r="42"/>
    <circle cx="902" cy="180" r="40"/>
    <path d="M1000 202h28l8-15 16 30 16-30 16 30 8-15h28" fill="none"/>
