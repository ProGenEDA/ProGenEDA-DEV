<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Codex 5.6 donor-native LTspice engineering banner</title>
  <desc id="description">A dark technical banner with an electric-blue circuit flowing from donor evidence to a verified native ASC schematic.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0c1f35"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="1">
