    <circle cx="398" cy="202" r="6"/><circle cx="495" cy="202" r="6"/><circle cx="710" cy="120" r="6"/>
    <circle cx="804" cy="180" r="6"/><circle cx="902" cy="120" r="6"/><circle cx="1127" cy="120" r="6"/>
    <circle cx="653" cy="214" r="6"/><circle cx="756" cy="300" r="6"/><circle cx="860" cy="224" r="6"/><circle cx="1129" cy="224" r="6"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <text x="70" y="94" fill="#78c8ff" font-size="18" font-weight="700" letter-spacing="4">MAINTAINER-DIRECTED ENGINEERING</text>
    <text x="70" y="153" fill="#ffffff" font-size="54" font-weight="800">CODEX 5.6 × LTSPICE</text>
